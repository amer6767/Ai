name: Engine-Isolation Firewall & Core Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  firewall-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy scipy opencv-python-headless mss python-xlib pydantic pyarrow zstandard fastapi uvicorn pytest onnx onnxruntime gymnasium httpx
      - name: Run Engine-Isolation AST Firewall Gate
        run: pytest tests/firewall/ -v
      - name: Run Unit Test Suite
        run: pytest tests/unit/ -v
