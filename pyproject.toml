[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "territorial-vision-ai"
version = "0.1.0"
description = "Autonomous computer-vision and reinforcement-learning AI for Territorial.io using external pixel observation and OS mouse/keyboard controls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "opencv-python-headless>=4.9",
    "mss>=9.0",
    "python-xlib>=0.33",
    "pydantic>=2.6",
    "pyarrow>=15.0",
    "zstandard>=0.22",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12.0",
    "gymnasium>=0.29",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "kaggle>=1.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
territorial-ai = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
